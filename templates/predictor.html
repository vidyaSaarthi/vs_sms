{% extends "layout.html" %}

{% block content %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<style>
    /* Styling for Multi-Select Elements to match Brand */
    .choices__inner { border-radius: 8px; border-color: #dee2e6; background-color: #fff; min-height: 45px;}
    .choices__list--multiple .choices__item { background-color: #cc0000; border: 1px solid #a30000; border-radius: 4px; }
    .choices[data-type*="select-multiple"] .choices__button { border-left: 1px solid rgba(255,255,255,0.3); }
    .filter-label { font-size: 0.85rem; text-transform: uppercase; color: #1e3c72; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 5px;}

    /* Ensure the table expands fully when generating PDF */
    .pdf-export-mode .table-responsive {
        max-height: none !important;
        overflow: visible !important;
    }
</style>

<div class="container-fluid pt-4 pb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0" style="color: #cc0000;">
                <i class="fas fa-magic me-2"></i>AI College Predictor
            </h2>
            <p class="text-muted mb-0 fw-bold">Predict allotments based on historical cutoff data.</p>
        </div>

        <form action="{{ url_for('upload_cutoffs') }}" method="POST" enctype="multipart/form-data" class="d-flex gap-2">
            <input type="file" name="file" class="form-control form-control-sm border-danger" accept=".csv" required title="Please save your Excel file as CSV before uploading.">
            <button type="submit" class="btn btn-sm text-white fw-bold shadow-sm" style="background-color: #cc0000;" onclick="this.innerHTML='<i class=\'fas fa-spinner fa-spin\'></i> Processing...';">
                <i class="fas fa-upload me-1"></i> Upload Cutoffs CSV
            </button>
        </form>
    </div>

    <div class="card shadow-sm border-0 mb-4" style="background-color: #ccdfed; border-radius: 12px;">
        <div class="card-body p-4">
            <form id="predictorForm" onsubmit="event.preventDefault(); runPrediction();">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="filter-label">Student Rank <span class="text-danger">*</span></label>
                        <input type="number" id="rankInput" class="form-control fw-bold border-0 shadow-sm" style="height: 45px; font-size: 1.1rem; color: #cc0000;" placeholder="e.g. 25000" required min="1">
                    </div>

                    <div class="col-md-9">
                        <label class="filter-label">Course(s)</label>
                        <select id="courseFilter" multiple class="form-control">
                            {% for c in courses %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="filter-label">State(s)</label>
                        <select id="stateFilter" multiple class="form-control">
                            {% for s in states %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="filter-label">College Type(s)</label>
                        <select id="typeFilter" multiple class="form-control">
                            {% for t in types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="filter-label">Domicile(s)</label>
                        <select id="domicileFilter" multiple class="form-control">
                            {% for d in domiciles %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="filter-label">Quota(s)</label>
                        <select id="quotaFilter" multiple class="form-control">
                            {% for q in quotas %}<option value="{{ q }}">{{ q }}</option>{% endfor %}
                        </select>
                    </div>

                    <div class="col-md-5">
                        <label class="filter-label">Category / Categories</label>
                        <select id="categoryFilter" multiple class="form-control">
                            {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3 d-flex align-items-end justify-content-end gap-2">
                        <button type="button" onclick="clearFilters()" class="btn btn-light fw-bold shadow-sm px-3" style="height: 45px; border: 1px solid #ced4da; color: #495057;">
                            <i class="fas fa-undo me-1"></i> Reset
                        </button>
                        <button type="submit" id="predictBtn" class="btn fw-bold shadow-sm flex-grow-1" style="background-color: #f6e89e; color: #cc0000; border: 1px solid #e5d580; height: 45px;">
                            <i class="fas fa-search me-1"></i> Predict
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-lg border-0" style="border-radius: 12px; overflow: hidden; display: none;" id="resultsCard">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold" style="color: #1e3c72;">
                Predicted Options: <span id="resultCount" class="text-danger">0</span>
            </h5>
            <button onclick="downloadPDF()" class="btn btn-sm btn-dark fw-bold shadow-sm" id="downloadPdfBtn">
                <i class="fas fa-file-pdf text-danger me-1"></i> Download PDF
            </button>
        </div>

        <div id="pdfContent" class="p-0 bg-white">
            <div class="table-responsive" style="max-height: 60vh;" id="tableContainer">
                <table class="table table-hover align-middle mb-0">
                    <thead style="position: sticky; top: 0; background-color: #f8f9fa; z-index: 10;">
                        <tr>
                            <th class="ps-4 py-3 text-secondary text-uppercase" style="font-size: 0.8rem;">State</th>
                            <th class="py-3 text-secondary text-uppercase" style="font-size: 0.8rem;">Course</th>
                            <th class="py-3 text-secondary text-uppercase" style="font-size: 0.8rem;">Type</th>
                            <th class="py-3 text-secondary text-uppercase" style="width: 25%; font-size: 0.8rem;">College Name</th>
                            <th class="py-3 text-secondary text-uppercase" style="font-size: 0.8rem;">Quota</th>
                            <th class="py-3 text-secondary text-uppercase" style="font-size: 0.8rem;">Category</th>
                            <th class="py-3 text-secondary text-uppercase" style="font-size: 0.8rem;">Domicile</th>
                            <th class="py-3 pe-4 text-danger text-end text-uppercase" style="font-size: 0.8rem;">Cutoff & Round</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
// 1. Initialize Multi-Select Libraries
const choiceConfig = { removeItemButton: true, searchEnabled: true, placeholderValue: 'Select...' };
const cCourse = new Choices('#courseFilter', choiceConfig);
const cState = new Choices('#stateFilter', choiceConfig);
const cType = new Choices('#typeFilter', choiceConfig);
const cDom = new Choices('#domicileFilter', choiceConfig);
const cQuota = new Choices('#quotaFilter', choiceConfig);
const cCat = new Choices('#categoryFilter', choiceConfig);

// Define the strict top-down hierarchy
const hierarchy = ['course', 'state', 'type', 'domicile', 'quota', 'category'];
const instances = {
    'course': cCourse, 'state': cState, 'type': cType,
    'domicile': cDom, 'quota': cQuota, 'category': cCat
};

// Function to instantly wipe all selections
function clearFilters() {
    document.getElementById('rankInput').value = '';

    Object.values(instances).forEach(inst => inst.removeActiveItems());

    document.getElementById('resultsCard').style.display = 'none';
    document.getElementById('resultsBody').innerHTML = '';
    document.getElementById('resultCount').innerText = '0';

    triggerCascade(null); // Passing null tells it to reset all dropdowns
}

// 2. Strict Top-Down Cascading Logic
async function triggerCascade(changedTrigger) {
    const payload = {
        course: cCourse.getValue(true),
        state: cState.getValue(true),
        type: cType.getValue(true),
        domicile: cDom.getValue(true),
        quota: cQuota.getValue(true),
        category: cCat.getValue(true)
    };

    const res = await fetch("{{ url_for('get_predictor_options') }}", {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });

    const data = await res.json();

    function updateInstance(instance, newOptions) {
        const currentVals = instance.getValue(true);
        instance.clearStore();
        const mappedOpts = newOptions.map(opt => ({
            value: opt,
            label: opt,
            // Keep it selected if it is still a valid option in the new list
            selected: currentVals.includes(opt)
        }));
        instance.setChoices(mappedOpts, 'value', 'label', true);
    }

    // 🚨 Only update fields that are BELOW the changed trigger in the hierarchy
    let shouldUpdate = false;
    if (!changedTrigger) shouldUpdate = true; // If cleared, update everything

    for (let i = 0; i < hierarchy.length; i++) {
        const field = hierarchy[i];

        if (shouldUpdate) {
            let newOptions = [];
            if (field === 'course') newOptions = data.courses;
            if (field === 'state') newOptions = data.states;
            if (field === 'type') newOptions = data.types;
            if (field === 'domicile') newOptions = data.domiciles;
            if (field === 'quota') newOptions = data.quotas;
            if (field === 'category') newOptions = data.categories;

            updateInstance(instances[field], newOptions);
        }

        // Once we hit the field that triggered the change, we flag to update everything BELOW it
        if (field === changedTrigger) {
            shouldUpdate = true;
        }
    }
}

// Attach event listeners for cascade
document.getElementById('courseFilter').addEventListener('change', () => triggerCascade('course'));
document.getElementById('stateFilter').addEventListener('change', () => triggerCascade('state'));
document.getElementById('typeFilter').addEventListener('change', () => triggerCascade('type'));
document.getElementById('domicileFilter').addEventListener('change', () => triggerCascade('domicile'));
document.getElementById('quotaFilter').addEventListener('change', () => triggerCascade('quota'));
document.getElementById('categoryFilter').addEventListener('change', () => triggerCascade('category'));

// 3. Prediction Engine (Keep your existing runPrediction and downloadPDF functions below here...)

// 3. Prediction Engine
async function runPrediction() {
    const rank = document.getElementById('rankInput').value;
    const btn = document.getElementById('predictBtn');
    const originalBtnText = btn.innerHTML;

    if (!rank || rank <= 0) return;

    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Predicting...';
    btn.disabled = true;

    const payload = {
        rank: rank,
        course: cCourse.getValue(true),
        state: cState.getValue(true),
        type: cType.getValue(true),
        quota: cQuota.getValue(true),
        category: cCat.getValue(true),
        domicile: cDom.getValue(true)
    };

    try {
        const response = await fetch("{{ url_for('get_predictions') }}", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();
        const tbody = document.getElementById('resultsBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-muted fw-bold">No colleges found within this rank range based on filters.</td></tr>';
        } else {
            data.forEach(college => {
                const formattedRank = college.closing_rank > 0 ? college.closing_rank.toLocaleString() : 'N/A';
                const roundText = college.closing_round && college.closing_round !== '-' ? college.closing_round : '';

                tbody.innerHTML += `
                    <tr>
                        <td class="ps-4 fw-bold text-dark">${college.state || '-'}</td>
                        <td class="fw-bold" style="color: #1e3c72;">${college.course || '-'}</td>
                        <td><span class="badge bg-secondary opacity-75">${college.college_type || '-'}</span></td>
                        <td class="fw-bold" style="color: #cc0000; font-size: 0.9rem;">${college.college_name || '-'}</td>
                        <td class="text-muted fw-bold small">${college.quota || '-'}</td>
                        <td><span class="badge shadow-sm" style="background-color: #ccdfed; color: #1e3c72; border: 1px solid rgba(30,60,114,0.1);">${college.category || '-'}</span></td>
                        <td class="text-dark small">${college.domicile || '-'}</td>
                        <td class="pe-4 text-end">
                            <div class="fw-bold text-danger fs-6">${formattedRank}</div>
                            <div class="text-muted small fw-bold" style="font-size: 0.7rem; text-transform: uppercase;">${roundText}</div>
                        </td>
                    </tr>
                `;
            });
        }

        document.getElementById('resultCount').innerText = data.length.toLocaleString();
        document.getElementById('resultsCard').style.display = 'block';

    } catch (error) {
        console.error('Error fetching predictions:', error);
        alert('An error occurred while generating predictions.');
    } finally {
        btn.innerHTML = originalBtnText;
        btn.disabled = false;
    }
}

// 🚨 BULLETPROOF PDF GENERATOR
function downloadPDF() {
    // 1. Loading State
    const btn = document.querySelector('button[onclick="downloadPDF()"]');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin text-danger me-1"></i> Generating...';
    btn.disabled = true;

    const rank = document.getElementById('rankInput').value;
    const element = document.getElementById('pdfContent');

    // 2. CLONE the table so we don't ruin the live UI
    const clone = element.cloneNode(true);

    // 3. Find the container inside the CLONE and force it to expand fully
    const clonedContainer = clone.querySelector('#tableContainer');
    if (clonedContainer) {
        clonedContainer.style.maxHeight = 'none';
        clonedContainer.style.overflow = 'visible';
    }

    // 4. Create and inject the Branded Header
    const headerHtml = `
        <div style="padding: 20px; text-align: center; border-bottom: 2px solid #cc0000; margin-bottom: 20px;">
            <h2 style="color: #cc0000; font-family: sans-serif; margin:0;">VidyaSaarthi College Predictions</h2>
            <p style="color: #666; font-family: sans-serif; font-weight: bold; margin: 5px 0 0 0;">Report Generated for Rank: ${rank}</p>
        </div>
    `;
    clone.insertAdjacentHTML('afterbegin', headerHtml);

    // 5. Configure PDF settings
    const opt = {
      margin:       0.5,
      filename:     `VidyaSaarthi_Predictions_Rank_${rank}.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
      jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' }
    };

    // 6. Generate and save
    html2pdf().set(opt).from(clone).save().then(() => {
        // Reset the button once the download finishes
        btn.innerHTML = originalText;
        btn.disabled = false;
    });
}
</script>
{% endblock %}
